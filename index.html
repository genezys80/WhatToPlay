<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prochaines sorties · ARPG et MMO</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF1F4;--card:#fff;--ink:#17212B;--mute:#5B6875;--line:#D5DCE3;--arpg:#B3203F;--mmo:#2450D6;--ok:#1F7A4D;--est:#8A5F00;--disp:"Bricolage Grotesque",system-ui,sans-serif;--body:Figtree,system-ui,sans-serif}
@media(prefers-color-scheme:dark){:root{--bg:#141A21;--card:#1C242D;--ink:#E8EDF2;--mute:#9AA7B4;--line:#2E3945;--arpg:#FF6B86;--mmo:#7C9BFF;--ok:#5FD39A;--est:#E2B455}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--body)}
main{max-width:860px;margin:0 auto;padding:clamp(16px,4vw,40px)}
a{color:inherit}
.site{font:600 15px var(--disp);color:var(--mute);margin:0}
.hero{border-left:10px solid var(--c,var(--line));padding:4px 0 4px clamp(16px,3vw,32px);margin:24px 0 36px}
.hero h1{font:800 clamp(56px,16vw,140px)/.95 var(--disp);letter-spacing:-.03em;margin:0}
.hero h2{font:600 clamp(20px,3.4vw,28px)/1.25 var(--disp);margin:14px 0 4px}
.hero p{margin:0;color:var(--mute)}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{font:600 14px var(--body);padding:6px 14px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid var(--mmo);outline-offset:2px}
.grp h2{font:600 15px var(--disp);color:var(--mute);margin:32px 0 8px}
.row{display:grid;grid-template-columns:72px 1fr auto;gap:4px 16px;align-items:start;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:8px;padding:14px 16px;margin:8px 0}
.row.done{opacity:.6}
.d{font:800 28px/1 var(--disp)}.d small{display:block;font:600 12px var(--body);color:var(--mute);margin-top:2px}
.game{font:600 13px var(--body);color:var(--c)}
.row h3{margin:2px 0 4px;font:600 18px/1.3 var(--disp)}
.row p{margin:0;color:var(--mute);font-size:14px}
.badge{font-size:12px;font-weight:600;padding:2px 10px;border-radius:99px;border:1px solid currentColor;white-space:nowrap}
.confirmed{color:var(--ok)}.estimated{color:var(--est)}.tba,.released{color:var(--mute)}
@media(max-width:560px){.row{grid-template-columns:60px 1fr}.badge{grid-column:2;justify-self:start}}
.news{margin-top:48px}.news h2{font:600 20px var(--disp)}
details{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 16px;margin:8px 0}
summary{cursor:pointer;font-weight:600}
details ul{margin:8px 0 4px;padding-left:18px;font-size:14px}
details li{margin:4px 0}.hint{color:var(--est);font-weight:600}
footer{margin:40px 0 0;color:var(--mute);font-size:13px}
</style>
</head>
<body>
<main>
  <p class="site">Prochaines sorties · ARPG et MMO</p>
  <section class="hero" id="hero"></section>
  <div class="bar" role="group" aria-label="Filtres">
    <button class="chip" data-k="all" aria-pressed="true">Tous</button>
    <button class="chip" data-k="ARPG" aria-pressed="false">ARPG</button>
    <button class="chip" data-k="MMO" aria-pressed="false">MMO</button>
    <button class="chip" id="done" aria-pressed="false">Déjà sortis</button>
  </div>
  <div id="list"></div>
  <section class="news"><h2>Dernières annonces</h2><div id="news"></div></section>
  <footer id="foot"></footer>
</main>
<script src="data.js"></script>
<script>
const {events,news,generated}=window.TRACKER,$=i=>document.getElementById(i),MS=864e5;
const today=new Date();today.setHours(0,0,0,0);
const parse=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d||1)};
const fmt=(d,o)=>new Intl.DateTimeFormat('fr-FR',o).format(d);
const cap=s=>s[0].toUpperCase()+s.slice(1);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LABEL={confirmed:'Confirmé',estimated:'Estimé',tba:'À confirmer',released:'Sorti'};
const COLOR={ARPG:'var(--arpg)',MMO:'var(--mmo)'};
const endOf=e=>{if(!e.date)return new Date(9999,0,1);const d=parse(e.date);
  return e.precision==='month'?new Date(d.getFullYear(),d.getMonth()+1,0):e.precision==='year'?new Date(d.getFullYear(),11,31):d};
const isDone=e=>e.status==='released'||(e.precision==='day'&&parse(e.date)<today);
const gkey=e=>!e.date?'9999':e.precision==='year'?e.date.slice(0,4)+'-13':e.date.slice(0,7);
const glabel=e=>!e.date?'Sans date annoncée':e.precision==='year'?e.date.slice(0,4)+' · date à confirmer':cap(fmt(parse(e.date),{month:'long',year:'numeric'}));
const dcol=e=>{if(!e.date)return'<div class="d">?</div>';const d=parse(e.date);
  if(e.precision==='day')return`<div class="d">${d.getDate()}<small>${fmt(d,{month:'short'})}</small></div>`;
  if(e.precision==='month')return`<div class="d">${fmt(d,{month:'short'})}<small>${d.getFullYear()}</small></div>`;
  return`<div class="d">${d.getFullYear()}</div>`};
const row=e=>{const st=isDone(e)?'released':e.status;
  return`<article class="row${st==='released'?' done':''}" style="--c:${COLOR[e.kind]}">${dcol(e)}
  <div><div class="game">${esc(e.game)}</div><h3>${esc(e.title)}</h3>
  <p>${e.dateLabel?esc(e.dateLabel)+(e.note?' · ':''):''}${esc(e.note||'')}${e.source?` <a href="${esc(e.source)}" target="_blank" rel="noopener">Source</a>`:''}</p></div>
  <span class="badge ${st}">${LABEL[st]}</span></article>`};
let kind='all',showDone=false;
function render(){
  const list=events.filter(e=>(kind==='all'||e.kind===kind)&&(showDone||!isDone(e))).sort((a,b)=>endOf(a)-endOf(b)||a.game.localeCompare(b.game));
  let html='',last='';
  for(const e of list){const k=gkey(e);if(k!==last){html+=(last?'</section>':'')+`<section class="grp"><h2>${glabel(e)}</h2>`;last=k}html+=row(e)}
  $('list').innerHTML=html?html+'</section>':'<p>Rien à afficher.</p>';
}
document.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{kind=b.dataset.k;
  document.querySelectorAll('[data-k]').forEach(x=>x.setAttribute('aria-pressed',x===b));render()});
$('done').onclick=e=>{showDone=!showDone;e.target.setAttribute('aria-pressed',showDone);render()};
// Hero : prochaine sortie datée
const next=events.filter(e=>!isDone(e)&&e.precision==='day').sort((a,b)=>parse(a.date)-parse(b.date))[0];
if(next){const n=Math.round((parse(next.date)-today)/MS);
  $('hero').style.setProperty('--c',COLOR[next.kind]);
  $('hero').innerHTML=`<h1>${n===0?"Aujourd’hui":n===1?'Demain':'Dans '+n+' jours'}</h1><h2>${esc(next.game)} · ${esc(next.title)}</h2><p>${cap(fmt(parse(next.date),{weekday:'long',day:'numeric',month:'long'}))}</p>`}
else $('hero').innerHTML='<h1>Rien de daté</h1><p>Aucune sortie datée pour le moment.</p>';
// Annonces automatiques
const games=Object.keys(news);
$('news').innerHTML=games.some(g=>news[g].length)?games.filter(g=>news[g].length).map(g=>`<details><summary>${esc(g)}</summary><ul>${news[g].map(n=>
  `<li><a href="${esc(n.link)}" target="_blank" rel="noopener">${esc(n.title)}</a>${n.dates.length?` <span class="hint">date repérée : ${esc(n.dates.join(', '))}</span>`:''}</li>`).join('')}</ul></details>`).join('')
  :'<p>Pas encore d’annonces : elles apparaissent après la première exécution de <code>scripts/update.py</code>.</p>';
$('foot').textContent='Données mises à jour le '+fmt(new Date(generated),{day:'numeric',month:'long',year:'numeric'})+'. Les dates « estimé » ne sont pas officielles.';
render();
</script>
</body>
</html>
